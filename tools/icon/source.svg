<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- night sky: deep navy, slightly lighter at the top -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18213a"/>
      <stop offset=".55" stop-color="#0e1426"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <!-- soft moonlight around the moon -->
    <radialGradient id="halo" cx="236" cy="176" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fa3d8" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#8fa3d8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8fa3d8" stop-opacity="0"/>
    </radialGradient>
    <!-- moon: warm gold, lighter on its lit edge -->
    <linearGradient id="moonFill" x1="196" y1="96" x2="300" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset=".55" stop-color="#f7d988"/>
      <stop offset="1" stop-color="#e8b85a"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="262" cy="148" r="70" fill="#fff"/>
      <circle cx="292" cy="124" r="60" fill="#000"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- pages: bright where the moonlight falls, a little darker toward the spine -->
    <linearGradient id="pageL" x1="128" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f3e6"/>
      <stop offset=".8" stop-color="#efe7d4"/>
      <stop offset="1" stop-color="#d9cfb9"/>
    </linearGradient>
    <linearGradient id="pageR" x1="384" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3eef8"/>
      <stop offset=".8" stop-color="#e6dff0"/>
      <stop offset="1" stop-color="#cdc4dd"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="300" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34406a"/>
      <stop offset="1" stop-color="#232c4c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- stars: a few sizes, kept clear of the moon and the corners -->
  <g fill="#e8e6ff">
    <circle cx="128" cy="116" r="3.4" opacity=".85"/>
    <circle cx="170" cy="190" r="2" opacity=".55"/>
    <circle cx="104" cy="226" r="2.4" opacity=".6"/>
    <circle cx="392" cy="104" r="2.6" opacity=".7"/>
    <circle cx="416" cy="214" r="2" opacity=".5"/>
    <circle cx="356" cy="236" r="1.8" opacity=".45"/>
    <circle cx="206" cy="86" r="1.8" opacity=".5"/>
  </g>
  <!-- two little four-point sparkles -->
  <g fill="#fbf4dc">
    <path d="M150 150l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".9"/>
    <path d="M374 160l2.2 6.6 6.6 2.2-6.6 2.2-2.2 6.6-2.2-6.6-6.6-2.2 6.6-2.2z" opacity=".75"/>
  </g>

  <!-- moon with a soft glow -->
  <circle cx="262" cy="148" r="70" fill="#f7d988" mask="url(#crescent)" filter="url(#glow)" opacity=".45"/>
  <circle cx="262" cy="148" r="70" fill="url(#moonFill)" mask="url(#crescent)"/>

  <!-- book -->
  <ellipse cx="256" cy="444" rx="132" ry="14" fill="#000" opacity=".45" filter="url(#shadow)"/>
  <path d="M256 334c-36-22-84-30-134-24v122c50-6 98 2 134 24 36-22 84-30 134-24V310c-50-6-98 2-134 24z" fill="url(#cover)"/>
  <path d="M252 324c-32-21-76-28-122-23v114c46-5 90 2 122 23z" fill="url(#pageL)"/>
  <path d="M260 324c32-21 76-28 122-23v114c-46-5-90 2-122 23z" fill="url(#pageR)"/>
  <!-- spine shadow -->
  <path d="M256 330v112" stroke="#9c93ad" stroke-width="3" opacity=".5"/>
  <!-- quiet lines of text, centred on each page -->
  <g stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M156 334c24-2 46 2 68 11M156 362c24-2 46 2 68 11M156 390c24-2 46 2 68 11" stroke="#d8ccb5"/>
    <path d="M288 345c22-9 44-13 68-11M288 373c22-9 44-13 68-11M288 401c22-9 44-13 68-11" stroke="#d2c8e2"/>
  </g>
</svg>
